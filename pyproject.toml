[project]
name = "finance-house-prod"
version = "0.1.0"
description = "Personal-loan default risk model — Finance House ML Engineer take-home"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "optuna>=3.6",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "mlflow>=2.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29"]

[project.scripts]
train = "loan_default.train:main"
tune = "loan_default.tune:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loan_default"]
